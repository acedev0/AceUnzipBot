name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg p7zip-full zstd
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt ruff==0.16.4
      - name: Lint
        run: ruff check acebot tests
      - name: Compile
        run: python -m compileall -q acebot tests
      - name: Test
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
      - name: Validate shell syntax
        run: bash -n install.sh setup.sh run.sh scripts/*.sh
