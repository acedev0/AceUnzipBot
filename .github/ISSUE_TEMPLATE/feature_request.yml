name: Feature request
description: Suggest a focused, safe improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the user problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Security, privacy, and deployment impact
      description: Describe new data, permissions, credentials, commands, or storage requirements.
    validations:
      required: true
