[project]
name = "ace-unzip-bot"
version = "2.0.0"
description = "A fast, secure, owner-controlled Telegram archive extraction bot."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ace", email = "Acedevmc@gmail.com"}]
keywords = ["telegram", "bot", "archive", "unzip", "telethon"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]

[project.urls]
Homepage = "https://github.com/acedev0/AceUnzipBot"
Documentation = "https://github.com/acedev0/AceUnzipBot/tree/main/docs"
Issues = "https://github.com/acedev0/AceUnzipBot/issues"
Source = "https://github.com/acedev0/AceUnzipBot"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
