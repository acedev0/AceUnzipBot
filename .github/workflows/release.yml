name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build clean release archive
        run: |
          archive="AceUnzipBot-${GITHUB_REF_NAME}.zip"
          git archive --format=zip --prefix=AceUnzipBot/ --output="$archive" HEAD
          sha256sum "$archive" > "$archive.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            AceUnzipBot-${{ github.ref_name }}.zip
            AceUnzipBot-${{ github.ref_name }}.zip.sha256
